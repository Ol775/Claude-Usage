name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-latest]        # the app targets macOS 13+, so build and self-test on older systems too
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Build
        working-directory: ClaudeUsage
        run: ./build.sh
      - name: Self-tests
        working-directory: ClaudeUsage
        run: "./Claude\\ Usage.app/Contents/MacOS/ClaudeUsage --selftest"
      - name: Check the disk image builds
        working-directory: ClaudeUsage
        run: ./make-dmg.sh
