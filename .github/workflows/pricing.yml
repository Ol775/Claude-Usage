name: Update model prices
on:
  schedule: [{cron: "17 5 * * *"}]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 .github/scripts/update_pricing.py
      - name: Commit changes
        run: |
          git diff --quiet ClaudeUsage/pricing.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update model prices from Anthropic's pricing page" ClaudeUsage/pricing.json
          git push
