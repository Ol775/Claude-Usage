<!doctype html><html><head><meta charset="utf-8"><title>Gallery</title><style>
*{box-sizing:border-box;margin:0;padding:0}html,body{background:#050506}
#stage{position:relative;width:960px;height:630px;overflow:hidden;background:radial-gradient(700px 360px at 50% 110%,rgba(255,138,92,.10),transparent 70%),#0d0d0f}
#glow{position:absolute;left:30px;top:30px;width:900px;height:570px;border-radius:16px;box-shadow:0 0 90px 10px rgba(255,138,92,.2),0 0 200px 40px rgba(255,138,92,.09)}
#win{position:absolute;left:30px;top:30px;width:900px;height:570px;border-radius:16px;overflow:hidden;background:#1c1c1e;box-shadow:0 0 0 1px rgba(255,255,255,.09),0 30px 60px rgba(0,0,0,.55)}
#inner{position:absolute;left:0;top:0;width:900px;height:570px;transform-origin:0 0}#inner img{width:900px;height:570px;display:block}
</style></head><body><div id="stage"><div id="glow"></div><div id="win"><div id="inner"><img id="im" alt=""></div></div></div>
<script>
// Camera tours per screen: [zoom, centre-x, centre-y] in window pixels (900x570): a gentle pan down the screen that keeps the full content width in view.
const SHOT="__SHOT__", LOOP=6000;
const FILES={overview:'1-overview',reports:'2-reports',insights:'3-insights','menu-bar':'4-menu-bar',light:'5-light',oled:'6-oled',chatgpt:'7-chatgpt',personalise:'8-personalise'};
const TOUR={overview:[[1.28,520,190],[1.28,520,400]], reports:[[1.28,520,150],[1.28,520,340]], insights:[[1.28,520,200],[1.28,520,350]],
 'menu-bar':[[1.6,640,150],[1.5,640,410]], light:[[1.28,520,190],[1.28,520,400]], oled:[[1.28,520,225],[1.28,520,470]],
 chatgpt:[[1.28,520,190],[1.28,520,430]], personalise:[[1.5,650,170],[1.5,650,330]]}[SHOT];
document.getElementById('im').src='assets/'+FILES[SHOT]+'.png';
const REST=[1,450,285];
const K=[[0,...REST],[500,...REST],[1500,...TOUR[0]],[2600,...TOUR[0]],[3500,...TOUR[1]],[4700,...TOUR[1]],[5700,...REST],[6000,...REST]];
const ease=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
function render(t){t=((t%LOOP)+LOOP)%LOOP;let j=0;while(j+1<K.length&&K[j+1][0]<=t)j++;
 const A=K[j],B=K[Math.min(j+1,K.length-1)],p=B[0]>A[0]?ease((t-A[0])/(B[0]-A[0])):0;
 const z=A[1]+(B[1]-A[1])*p,cx=A[2]+(B[2]-A[2])*p,cy=A[3]+(B[3]-A[3])*p;
 const tx=Math.min(0,Math.max(900-900*z,450-cx*z)),ty=Math.min(0,Math.max(570-570*z,285-cy*z));
 document.getElementById('inner').style.transform=`translate(${tx}px,${ty}px) scale(${z})`;}
let t0=performance.now(),raf;const tick=()=>{render(performance.now()-t0);raf=requestAnimationFrame(tick)};
window.runLoop=()=>{cancelAnimationFrame(raf);t0=performance.now();tick()};
window.seekTo=s=>{cancelAnimationFrame(raf);render(s*1000)};
document.fonts.ready.then(()=>window.runLoop());
</script></body></html>
