<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-labelledby="t d"><title id="t">From a change to a pull request</title><desc id="d">Build, run the self-test, run bump.sh, then open a pull request that CI checks on macOS 14, 15 and latest.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1c1f"/><stop offset="1" stop-color="#0d0d0f"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#ff8a5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}.k{font-size:12px;font-weight:600;letter-spacing:.09em;fill:#ff8a5c}.h{font-weight:700;fill:#f4f1ee}.s{fill:#b3ada7}.f{font-size:14px;fill:#b3ada7}.c{fill:#232326;stroke:#3a3a3f;stroke-width:1.2}.a{stroke:#ff8a5c}@media (prefers-reduced-motion:no-preference){.arrow{stroke-dasharray:5 5;animation:flow 1.2s linear infinite}}@keyframes flow{to{stroke-dashoffset:-10}}</style></defs><rect width="1000" height="230" rx="16" fill="url(#bg)" stroke="#2c2c30"/>
<rect class="c" x="28.0" y="40" width="206.0" height="150" rx="12"/>
<text class="k" x="46.0" y="72">1</text><text class="h" style="font-size:19px" x="46.0" y="102">Build</text>
<text class="s" style="font-size:14px" x="46.0" y="130">./build.sh</text>
<path class="arrow" d="M238.0 115.0 H268.0" stroke="#ff8a5c" stroke-width="2" fill="none" marker-end="url(#ar)" stroke-linecap="round"/>
<rect class="c" x="274.0" y="40" width="206.0" height="150" rx="12"/>
<text class="k" x="292.0" y="72">2</text><text class="h" style="font-size:19px" x="292.0" y="102">Self-test</text>
<text class="s" style="font-size:14px" x="292.0" y="130">--selftest</text>
<path class="arrow" d="M484.0 115.0 H514.0" stroke="#ff8a5c" stroke-width="2" fill="none" marker-end="url(#ar)" stroke-linecap="round"/>
<rect class="c" x="520.0" y="40" width="206.0" height="150" rx="12"/>
<text class="k" x="538.0" y="72">3</text><text class="h" style="font-size:19px" x="538.0" y="102">Bump</text>
<text class="s" style="font-size:14px" x="538.0" y="130">./bump.sh patch</text>
<text class="s" style="font-size:14px" x="538.0" y="152">&quot;short note&quot;</text>
<path class="arrow" d="M730.0 115.0 H760.0" stroke="#ff8a5c" stroke-width="2" fill="none" marker-end="url(#ar)" stroke-linecap="round"/>
<rect class="c a" x="766.0" y="40" width="206.0" height="150" rx="12"/>
<text class="k" x="784.0" y="72">4</text><text class="h" style="font-size:19px" x="784.0" y="102">Pull request</text>
<text class="s" style="font-size:14px" x="784.0" y="130">CI runs on macOS</text>
<text class="s" style="font-size:14px" x="784.0" y="152">14, 15 and latest</text>
</svg>
