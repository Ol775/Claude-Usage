<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 252" width="1000" height="252" role="img" aria-labelledby="t d"><title id="t">The release order</title><desc id="d">Bump the version, build and self-test, push, wait for green CI, do a dry run, then release.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1c1f"/><stop offset="1" stop-color="#0d0d0f"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#ff8a5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}.k{font-size:12px;font-weight:600;letter-spacing:.09em;fill:#ff8a5c}.h{font-weight:700;fill:#f4f1ee}.s{fill:#b3ada7}.f{font-size:14px;fill:#b3ada7}.c{fill:#232326;stroke:#3a3a3f;stroke-width:1.2}.a{stroke:#ff8a5c}@media (prefers-reduced-motion:no-preference){.arrow{stroke-dasharray:5 5;animation:flow 1.2s linear infinite}}@keyframes flow{to{stroke-dashoffset:-10}}</style></defs><rect width="1000" height="252" rx="16" fill="url(#bg)" stroke="#2c2c30"/>
<rect class="c" x="28.0" y="40" width="132.3" height="150" rx="12"/>
<text class="k" x="46.0" y="72">1</text><text class="h" style="font-size:16px" x="46.0" y="102">bump.sh</text>
<text class="s" style="font-size:13px" x="46.0" y="130">Version and</text>
<text class="s" style="font-size:13px" x="46.0" y="149">change log</text>
<path class="arrow" d="M164.3 115.0 H184.3" stroke="#ff8a5c" stroke-width="2" fill="none" marker-end="url(#ar)" stroke-linecap="round"/>
<rect class="c" x="190.3" y="40" width="132.3" height="150" rx="12"/>
<text class="k" x="208.3" y="72">2</text><text class="h" style="font-size:16px" x="208.3" y="102">build.sh</text>
<text class="s" style="font-size:13px" x="208.3" y="130">Build and</text>
<text class="s" style="font-size:13px" x="208.3" y="149">--selftest</text>
<path class="arrow" d="M326.7 115.0 H346.7" stroke="#ff8a5c" stroke-width="2" fill="none" marker-end="url(#ar)" stroke-linecap="round"/>
<rect class="c" x="352.7" y="40" width="132.3" height="150" rx="12"/>
<text class="k" x="370.7" y="72">3</text><text class="h" style="font-size:16px" x="370.7" y="102">Push</text>
<text class="s" style="font-size:13px" x="370.7" y="130">Commit, pull</text>
<text class="s" style="font-size:13px" x="370.7" y="149">--rebase, push</text>
<path class="arrow" d="M489.0 115.0 H509.0" stroke="#ff8a5c" stroke-width="2" fill="none" marker-end="url(#ar)" stroke-linecap="round"/>
<rect class="c" x="515.0" y="40" width="132.3" height="150" rx="12"/>
<text class="k" x="533.0" y="72">4</text><text class="h" style="font-size:16px" x="533.0" y="102">CI</text>
<text class="s" style="font-size:13px" x="533.0" y="130">Green for that</text>
<text class="s" style="font-size:13px" x="533.0" y="149">exact commit</text>
<path class="arrow" d="M651.3 115.0 H671.3" stroke="#ff8a5c" stroke-width="2" fill="none" marker-end="url(#ar)" stroke-linecap="round"/>
<rect class="c" x="677.3" y="40" width="132.3" height="150" rx="12"/>
<text class="k" x="695.3" y="72">5</text><text class="h" style="font-size:16px" x="695.3" y="102">Dry run</text>
<text class="s" style="font-size:13px" x="695.3" y="130">release.sh</text>
<text class="s" style="font-size:13px" x="695.3" y="149">--dry-run</text>
<path class="arrow" d="M813.7 115.0 H833.7" stroke="#ff8a5c" stroke-width="2" fill="none" marker-end="url(#ar)" stroke-linecap="round"/>
<rect class="c a" x="839.7" y="40" width="132.3" height="150" rx="12"/>
<text class="k" x="857.7" y="72">6</text><text class="h" style="font-size:16px" x="857.7" y="102">Release</text>
<text class="s" style="font-size:13px" x="857.7" y="130">Signed DMG</text>
<text class="s" style="font-size:13px" x="857.7" y="149">+ Homebrew</text>
<text class="f" x="500.0" y="228" text-anchor="middle">release.sh refuses to run if any check is missing. One order, every time.</text>
</svg>
