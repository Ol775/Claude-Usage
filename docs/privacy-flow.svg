<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d"><title id="t">What Claude Usage talks to</title><desc id="d">Your data stays on your Mac. The app asks Anthropic for your usage limits, ChatGPT only if you connect it, and GitHub for updates, the change log and model prices. There are no analytics.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1c1f"/><stop offset="1" stop-color="#0d0d0f"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#ff8a5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}.k{font-size:12px;font-weight:600;letter-spacing:.09em;fill:#ff8a5c}.h{font-weight:700;fill:#f4f1ee}.s{fill:#b3ada7}.f{font-size:14px;fill:#b3ada7}.c{fill:#232326;stroke:#3a3a3f;stroke-width:1.2}.a{stroke:#ff8a5c}@media (prefers-reduced-motion:no-preference){.arrow{stroke-dasharray:5 5;animation:flow 1.2s linear infinite}}@keyframes flow{to{stroke-dashoffset:-10}}</style></defs><rect width="1000" height="330" rx="16" fill="url(#bg)" stroke="#2c2c30"/>
<rect class="c a" x="28" y="40" width="330" height="214" rx="12"/>
<text class="k" x="48" y="72">YOUR MAC</text><text class="h" style="font-size:22px" x="48" y="102">Claude Usage</text>
<text class="s" style="font-size:14px" x="48" y="132">History, settings and profile</text>
<text class="s" style="font-size:14px" x="48" y="156">photo stay here.</text>
<text class="s" style="font-size:14px" x="48" y="180">Claude Code logs and sign-in</text>
<text class="s" style="font-size:14px" x="48" y="204">are read-only, never stored.</text>
<rect class="c" x="470" y="40" width="502" height="64" rx="12"/>
<text class="k" x="490" y="64">ANTHROPIC</text><text class="h" style="font-size:17px" x="490" y="87">Your usage limits</text>
<text class="s" style="font-size:13px" x="952" y="87" text-anchor="end">api.anthropic.com</text>
<path class="arrow" d="M362 147 C 410 147, 410 72, 462 72" stroke="#ff8a5c" stroke-width="2" fill="none" marker-end="url(#ar)" stroke-linecap="round"/>
<rect class="c" x="470" y="118" width="502" height="64" rx="12"/>
<text class="k" x="490" y="142">CHATGPT · ONLY IF YOU CONNECT IT</text><text class="h" style="font-size:17px" x="490" y="165">Your ChatGPT limits</text>
<text class="s" style="font-size:13px" x="952" y="165" text-anchor="end">chatgpt.com</text>
<path class="arrow" d="M362 147 C 410 147, 410 150, 462 150" stroke="#ff8a5c" stroke-width="2" fill="none" marker-end="url(#ar)" stroke-linecap="round"/>
<rect class="c" x="470" y="196" width="502" height="64" rx="12"/>
<text class="k" x="490" y="220">GITHUB</text><text class="h" style="font-size:17px" x="490" y="243">Updates, change log and model prices</text>
<text class="s" style="font-size:13px" x="952" y="243" text-anchor="end">github.com</text>
<path class="arrow" d="M362 147 C 410 147, 410 228, 462 228" stroke="#ff8a5c" stroke-width="2" fill="none" marker-end="url(#ar)" stroke-linecap="round"/>
<text class="f" x="500.0" y="296" text-anchor="middle">No analytics, and nothing else is sent. Diagnostics are never sent automatically.</text></svg>
